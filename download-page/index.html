<style>
*{box-sizing:border-box}html,body{min-height:100%;margin:0}

.cab{display:flex;align-items:center;gap:48px;flex-wrap:wrap;padding:14px 24px;color:#fff;background:#0B2A4A}
.logo{display:block;width:150px;height:auto}
.cab h2{margin:0;font-size:17px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.cab small{display:block;margin-top:2px;font-size:13px;font-weight:400;letter-spacing:0;text-transform:none;opacity:.85}

.corpo{padding:28px 32px 32px}
.st{display:grid;width:60px;height:60px;margin:0 auto 16px;color:#fff;background:#0B2A4A;border-radius:50%;font-size:28px;font-weight:700;place-items:center}
.st.erro{background:#b42318}
h1{margin:0 0 8px;font-size:24px}p{color:#667085;line-height:1.55;margin:0 0 8px}
.arq{display:flex;justify-content:space-between;gap:16px;padding:12px 14px;margin:20px 0 14px;text-align:left;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:10px}
.bt{display:block;width:100%;border:0;cursor:pointer;font:inherit;padding:13px 18px;color:#fff;background:#0B2A4A;border-radius:10px;font-weight:700;text-decoration:none}
.bt:focus-visible{outline:3px solid #1465b3;outline-offset:2px}
.nota{font-size:12.5px}.oculto{display:none}
</style>
